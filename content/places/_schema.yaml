$schema: "https://json-schema.org/draft/2020-12/schema"
title: Places
description: >
  Places I have personally visited. Applies to every place YAML under
  content/places/ via the plugin's nearest-ancestor lookup, so all
  place data shares one field vocabulary. Only name/lat/lon are
  required; every other field is optional and category-dependent.
  Omit status for normal entries; only record known exceptions such as
  closed places.
type: object
additionalProperties:
  type: object
  additionalProperties: true
  required: [name, lat, lon]
  properties:
    # ── Identity ────────────────────────────────────────────────
    name:
      type: string
      title: 地點
      x-osm-list-i18n:
        title:
          en: Place
          ja: 場所
    icon:
      type: string
      title: 圖示
      description: >
        Emoji marker override. Takes precedence over the category
        lookup in x-osm-icon; only set it when the category mapping
        gives the wrong pin.
      x-osm-list-hidden: true
      x-osm-list-i18n:
        title:
          en: Icon
          ja: アイコン
    category:
      type: string
      title: 類型
      x-osm-list-hidden: true
      x-osm-icon:
        咖啡廳: ☕
        共享空間: 🏢
        書店: 📚
        神社: ⛩️
        拳擊館: 🥊
        貓咪咖啡廳: 🐱
      x-osm-list-i18n:
        title:
          en: Type
          ja: 種類

    # ── Location ────────────────────────────────────────────────
    lat:
      type: number
      minimum: -90
      maximum: 90
      x-osm-list-hidden: true
    lon:
      type: number
      minimum: -180
      maximum: 180
      x-osm-list-hidden: true
    address:
      type: string
      title: 地址
      x-osm-list-hidden: true
      x-osm-list-i18n:
        title:
          en: Address
          ja: 住所
    country:
      type: string
      title: 國家
      x-osm-list-i18n:
        title:
          en: Country
          ja: 国
    city:
      type: string
      title: 縣市
      x-osm-list-i18n:
        title:
          en: City
          ja: 都市
    district:
      type: string
      title: 行政區
      x-osm-list-i18n:
        title:
          en: District
          ja: 地区

    # ── OSM linkage ─────────────────────────────────────────────
    osm_type:
      type: string
      enum: [node, way, relation]
      title: OSM 類型
      x-osm-list-hidden: true
    osm_id:
      type: integer
      title: OSM ID
      x-osm-list-hidden: true

    # ── Lifecycle ───────────────────────────────────────────────
    status:
      type: string
      title: 狀態
      x-osm-list-i18n:
        title:
          en: Status
          ja: 状態
    closed_date:
      type: string
      title: 歇業時間
      x-osm-list-i18n:
        title:
          en: Closed
          ja: 閉店

    # ── Facilities (objectively verifiable) ─────────────────────
    hours:
      type: string
      title: 營業時間
      x-osm-list-i18n:
        title:
          en: Hours
          ja: 営業時間
    power:
      type: string
      title: 插座
      x-osm-list-i18n:
        title:
          en: Power
          ja: 電源
    wifi:
      type: string
      title: Wi-Fi
    time_limit:
      type: string
      title: 限時
      x-osm-list-i18n:
        title:
          en: Time limit
          ja: 時間制限
    meal:
      type: string
      title: 餐點
      x-osm-list-i18n:
        title:
          en: Food
          ja: 食事
    min_spend:
      type: string
      title: 低消
      x-osm-list-i18n:
        title:
          en: Minimum spend
          ja: 最低利用料金

    # ── Personal ratings (subjective, mine alone) ───────────────
    noise:
      type: string
      title: 安靜程度
      x-osm-list-i18n:
        title:
          en: Quietness
          ja: 静かさ
    work_score:
      type: string
      title: 工作適合度
      x-osm-list-i18n:
        title:
          en: Work score
          ja: 作業しやすさ
    visit_note:
      type: string
      title: 造訪備註
      x-osm-list-i18n:
        title:
          en: Visit note
          ja: 訪問メモ

    # ── References ──────────────────────────────────────────────
    tags:
      type: array
      items:
        type: string
    urls:
      type: array
      items:
        type: object
        properties:
          label:
            type: string
          href:
            type: string
